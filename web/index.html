<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Piyasa Masası</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M6 22l6-6 5 4 9-10' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script>
  /* Apply saved theme / sidebar state before first paint (storage may be blocked). */
  try {
    var t = JSON.parse(localStorage.getItem('pm.theme') || '"dark"');
    document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    if (JSON.parse(localStorage.getItem('pm.sbCollapsed') || 'false')) document.documentElement.classList.add('sb-collapsed');
  } catch (e) { /* defaults */ }
</script>
</head>
<body>
<button type="button" class="skip" data-act="skip">İçeriğe geç</button>
<div id="app">
  <aside id="sidebar" aria-label="Ana menü">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1d4ed8"/><path d="M6 22l6-6 5 4 9-10" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="10" r="2.6" fill="#22c55e"/></svg>
      <span class="brand-name">Piyasa Masası</span>
    </div>
    <nav id="nav">
      <a href="#haberler" class="nav-item" data-key="haberler" title="Haberler (1)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h12v14H6a2 2 0 0 1-2-2z"/><path d="M16 9h4v8a2 2 0 0 1-2 2h-2"/><path d="M7 9h6M7 12h6M7 15h4"/></svg>
        <span class="lbl">Haberler</span><span class="badge" id="b-haberler" hidden></span><kbd>1</kbd>
      </a>
      <a href="#kim-ne-diyor" class="nav-item" data-key="kim-ne-diyor" title="Kim Ne Diyor (2)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h11v8h-6l-5 3.5z"/><path d="M14.5 9h6v8l-3.5-2.5H11V13"/></svg>
        <span class="lbl">Kim Ne Diyor</span><kbd>2</kbd>
      </a>
      <a href="#firsatlar" class="nav-item" data-key="firsatlar" title="Fırsatlar (3)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg>
        <span class="lbl">Fırsatlar</span><span class="badge green" id="b-firsatlar" hidden></span><kbd>3</kbd>
      </a>
      <a href="#karne" class="nav-item" data-key="karne" title="Sinyal Karnesi: fırsat sinyalleri sonradan ne kazandırdı?">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l2 2v14H5V6z"/><path d="M8.5 12l2 2 4-4.5"/><path d="M9 17.5h6"/></svg>
        <span class="lbl">Sinyal Karnesi</span>
      </a>
      <a href="#pano" class="nav-item" data-key="pano" title="Piyasa Panosu (4)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16.5a8 8 0 1 1 16 0"/><path d="M12 16.5l4-5"/><path d="M3.5 20h17"/></svg>
        <span class="lbl">Piyasa Panosu</span><kbd>4</kbd>
      </a>
      <a href="#takvim" class="nav-item" data-key="takvim" title="Takvim (5)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <span class="lbl">Takvim</span><kbd>5</kbd>
      </a>
      <a href="#brifingler" class="nav-item" data-key="brifingler" title="Brifingler (6)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h7.5l4.5 4.5V21h-12z"/><path d="M14 3v4.5h4.5"/><path d="M9.5 12.5h6M9.5 16h6"/></svg>
        <span class="lbl">Brifingler</span><kbd>6</kbd>
      </a>
      <a href="#hisse" class="nav-item" data-key="hisse" title="Hisse (7)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5v17M17 3.5v17"/><rect x="5" y="7.5" width="4" height="8" rx="1"/><rect x="15" y="5.5" width="4" height="9" rx="1"/></svg>
        <span class="lbl">Hisse</span><kbd>7</kbd>
      </a>
      <a href="#ayarlar" class="nav-item" data-key="ayarlar" title="Kaynaklar &amp; Ayarlar (8)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span class="lbl">Kaynaklar &amp; Ayarlar</span><kbd>8</kbd>
      </a>
      <a href="#islem" class="nav-item" data-key="islem" title="Sanal İşlem (9)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16"/><path d="M6.5 16V11M11 16V7M15.5 16v-6M20 16V5"/></svg>
        <span class="lbl">Sanal İşlem</span><span class="badge green" id="b-islem" hidden></span><kbd>9</kbd>
      </a>
      <a href="#lab" class="nav-item" data-key="lab" title="Test Laboratuvarı: 4 bot + hakem, 5 yıllık geçmişte">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5h5M10.5 3.5v6L5 19a1.5 1.5 0 0 0 1.3 2.3h11.4A1.5 1.5 0 0 0 19 19l-5.5-9.5v-6"/><path d="M7.5 15h9"/></svg>
        <span class="lbl">Test Laboratuvarı</span>
      </a>
    </nav>
    <div class="sb-foot">
      <div class="sb-stats" id="sb-stats"></div>
      <button type="button" class="ibtn sb-toggle" data-act="sidebar" title="Kenar çubuğunu daralt / genişlet" aria-label="Kenar çubuğunu daralt veya genişlet">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15"/></svg>
      </button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <h1 id="page-title">Haberler</h1>
      <div class="tb-mid">
        <span id="sess" class="sess closed" title="ABD piyasa seansı">—</span>
        <span class="clock" title="İstanbul saati"><b id="clk-tr">--:--:--</b> TR</span>
        <span class="clock" title="New York saati"><b id="clk-et">--:--</b> ET</span>
        <span id="countdown" class="cd"></span>
      </div>
      <div class="tb-right">
        <form id="gsearch-form" class="search tsearch" role="search">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="gsearch" class="inp" type="search" placeholder="Hisse ya da haber ara…" autocomplete="off" spellcheck="false" aria-label="Hisse sembolü ya da haber ara">
        </form>
        <span id="conn" class="conn" hidden>Bağlantı yok</span>
        <span id="src-warn" class="pill amber src-warn" hidden title="Hata veren kaynak grubu">Kaynak hatası</span>
        <span id="bg-run" class="pill amber bg-run" hidden title="Uygulama pencere olmadan (başlangıç kısayolu / --no-window) çalışıyor; veri toplama sürüyor. Tamamen kapatmak için: Ayarlar → Uygulamayı tamamen kapat.">Arka planda çalışıyor</span>
        <span id="last-upd" class="last-upd"></span>
        <button type="button" class="ibtn" id="btn-refresh" data-act="refresh" title="Ekranı yenile (r)" aria-label="Ekranı yenile">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.5H15"/></svg>
        </button>
        <button type="button" class="ibtn" data-act="refresh-all" title="Tüm kaynakları şimdi çek (Shift+R)" aria-label="Tüm kaynakları şimdi çek">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        </button>
        <button type="button" class="ibtn" data-act="theme" title="Açık / koyu tema" aria-label="Temayı değiştir">
          <svg class="ico i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg>
          <svg class="ico i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
      </div>
    </header>
    <div id="view" tabindex="-1">
      <div class="state"><span class="spin" aria-hidden="true"></span>Yükleniyor…</div>
    </div>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
<noscript><div class="noscript">Piyasa Masası için JavaScript gerekli.</div></noscript>
<script src="app.js"></script>
</body>
</html>
